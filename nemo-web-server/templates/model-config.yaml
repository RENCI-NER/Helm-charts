{{ $dataPath := include "modelPath" . | trim  }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemo-web-server.fullname" . }}-model-configmap
  labels:
    {{- include "nemo-web-server.labels" . | nindent 4 }}
data:
  config.yaml: |-
    {{ .Values.modelConfig.models | toYaml | nindent 4 }}
