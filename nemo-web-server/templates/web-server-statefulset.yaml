{{ if not .Values.annotate.enabled }}
{{ $modelPath := include "modelPath" . | trim }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nemo-web-server.fullname" . }}
  labels:
    {{- include "nemo-web-server.labels" . | nindent 4 }}
    app: web-server
spec:
  serviceName: {{ include "nemo-web-server.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nemo-web-server.selectorLabels" . | nindent 6 }}
      app: web-server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/model-config.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nemo-web-server.selectorLabels" . | nindent 8 }}
        app: web-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{ if .Values.modelConfig.downloadModels }}
      initContainers:
        {{- range $key, $value := .Values.modelConfig.models }}
        - name: {{ lower $key | replace "_" "-" }}-downloader
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
           - ash
          args:
          - /download.sh
          env:
          - name: FILE_NAME
            value: {{ $value.fileName }}
          - name: URL
            value: {{ $value.repoUrl}}{{ $value.fileName }}
          volumeMounts:
          - name: models-pvc
            mountPath: {{ $modelPath }}
          - name: scripts-config
            mountPath: /download.sh
            subPath: download.sh
        {{- end }}
      {{ end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          - 'uvicorn'
          args:
          - '--port'
          - '8080'
          - '--host'
          - '0.0.0.0'
          - src.server:app
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
          # torch sizes its thread pool from the host's core count, not the
          # cgroup CPU limit. On a 96-core node with a 4-CPU limit that is 48
          # OpenMP threads over 4 CPUs of quota: 880ms per SapBERT forward pass
          # vs 56ms at 4 threads. Keep this in step with resources.limits.cpu.
          - name: OMP_NUM_THREADS
            value: {{ .Values.torchThreads | quote }}
          - name: MKL_NUM_THREADS
            value: {{ .Values.torchThreads | quote }}
#           livenessProbe:
#             httpGet:
#               path: /
#               port: http
#           readinessProbe:
#             httpGet:
#               path: /
#               port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
          - name: model-config
            mountPath: /var/web/nemo-serve/config.yaml
            subPath: "config.yaml"
          - name: models-pvc
            mountPath: {{ $modelPath }}
          - name: tmp
            mountPath: /tmp
          - name: shm
            mountPath: /dev/shm

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: model-config
          configMap:
            name: {{ include "nemo-web-server.fullname" . }}-model-configmap
            defaultMode: 0777
        - name: scripts-config
          configMap:
            name: {{ include "nemo-web-server.fullname" . }}-scripts-configmap
            defaultMode: 0777
        - name: shm
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: models-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
{{/*    - metadata:*/}}
{{/*        name: tmp*/}}
{{/*      spec:*/}}
{{/*        accessModes: [ "ReadWriteOnce" ]*/}}
{{/*        resources:*/}}
{{/*          requests:*/}}
{{/*            storage: {{ .Values.storage.size }}*/}}

{{ end }}