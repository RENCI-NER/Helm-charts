apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemo-web-server.fullname" . }}
  labels:
    {{- include "nemo-web-server.labels" . | nindent 4 }}
    app: web-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nemo-web-server.selectorLabels" . | nindent 4 }}
    app: web-server
---
{{ if .Values.varnish_cache.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemo-web-server.fullname" . }}-varnish-cache-svc
  labels:
    {{- include "nemo-web-server.labels" . | nindent 4 }}
    app: varnish-cache
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nemo-web-server.selectorLabels" . | nindent 4 }}
    app: varnish-cache
{{ end }}

