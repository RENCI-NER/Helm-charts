
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    cert-manager.io/cluster-issuer: letsencrypt
#    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
  hosts:
    - host: sap-qdrant-test.apps.renci.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: sap-qdrant-test.apps.renci.org-tls
     hosts:
       - sap-qdrant-test.apps.renci.org

modelConfig:
  downloadModels: false
  models:
    sapbert:
      class: SapbertWrapper
      connectionParams:
        # This release's own qdrant cluster ({{ .Release.Name }}-q1).
        # It previously pointed at qdrant-sapbert-q1, a different release whose
        # collection has indexed_vectors_count: 0 (4.6M points, brute-force
        # only). Do not point back at it.
        host: sap-qdrant-v2-q1
        index: sapbert
        password: ""
        port: "6333"
        scheme: http
#      ground_truth_data_id_type_pairs_path: /data/id_types.csv
#      ground_truth_id_name_pairs_path: /data/name_ids.csv
#      ground_truth_predictions_path: /data/babel_prediction_output.npy
      path: /models/
      storage: qdrant




# Default values for nemo-web-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: containers.renci.org/helxplatform/nemo-serve
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # 23.10-perf3: inference_mode + dynamic padding + bounded run_in_threadpool,
  # plus gRPC to qdrant and quantization rescoring. See FINDINGS section 9.
  # Do not use perf1 — its threadpool was unbounded and reintroduced CPU
  # oversubscription.
  # Built as an overlay on :23.10, NOT from a git commit — rebuild from a pushed
  # branch before treating this as a release artifact.
  tag: "23.10-perf3"





imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80


storage:
  size: 2Gi



# Keep in step with resources.limits.cpu below. See the OMP_NUM_THREADS comment
# in templates/web-server-statefulset.yaml.
torchThreads: 4

resources:
  limits:
    cpu: 4
    memory: 4Gi
#    nvidia.com/mig-1g.5gb: 1
    ephemeral-storage: 10Gi

  requests:
    # A SapBERT forward pass saturates all 4 threads. At a 500m request the pod
    # runs on burst credit and gets CFS-throttled under sustained load.
    cpu: 2
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}

annotate:
  enabled: false

varnish_cache:
  enabled: false

qdrant:
  enabled: true


q1:
  # values.yaml for Qdrant cluster setup

  replicaCount: 3  # start with 3 nodes; you can increase later

  image:
    repository: qdrant/qdrant
    tag: v1.15.4  # adjust to specific version you want

  service:
    # If you need TLS for client connections
    enable_tls: false
#    api_key: ""   # strongly recommended in prod
#    read_only_api_key: ""            # optional

  resources:
    requests:
      cpu: "4"
      memory: "64Gi"
    limits:
      cpu: "4"
      memory: "64Gi"

  persistence:
    enabled: true
    size: 1000Gi            # persistent volume size per node
    storageClassName: "basic"  # define or use your NVMe SSD class
    accessModes:
      - ReadWriteOnce
    # allow volume expansion if your storage class supports it
    allowVolumeExpansion: true



  # Enable cluster mode (distributed deployment)
  config:
    cluster:
      enabled: true
      p2p:
        port: 6335
        # optionally configure bootstrap peer(s) if needed
      consensus:
        tick_period_ms: 100   # default is fine; you can tweak lower if you want faster detection of failures

    # Vectors & storage / indexing config
    storage:
      hnsw_index:
        # Storage is NetApp NFS (StorageClass "basic"), so on_disk: true makes
        # every HNSW graph hop a network round trip to the filer. Measured
        # 137.9ms -> 3.0ms p50 by moving the graph into RAM.
        on_disk: false

      # Defaults applied to NEWLY CREATED collections. These must live under
      # `collection:` — qdrant 1.15 ignores `storage.vectors` /
      # `storage.quantization` at the top level, so the previous version of this
      # block did nothing at all.
      collection:
        vectors:
          # Raw f32 vectors are only read for rescoring; the int8 copy in RAM
          # answers the search. 700k x 768 x 4B = 2.1GB, not worth resident.
          on_disk: true
        quantization:
          scalar:
            type: int8
            quantile: 0.99
            # ~540MB for 700k vectors, against 64Gi per pod. This is the setting
            # that matters.
            always_ram: true

      optimizers:
        deleted_threshold: 0.5
        vacuum_min_vector_number: 1500
        default_segment_number: 2
        max_segment_size_kb: null
        memmap_threshold_kb: null
        indexing_threshold_kb: 25000
        flush_interval_sec: 5
        # 1 serialises index rebuilds against a 4-CPU limit.
        max_optimization_threads: 4


  # Node resources / scaling behaviour
  autoscaling:
    enabled: false   # start with fixed count; can enable later
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  ingress:
    enabled: true
    ingressClassName: ""
    additionalLabels: { }
    annotations:
      nginx.ingress.kubernetes.io/enable-cors: "true"
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: sap-qdrant-test.apps.renci.org
        paths:
          - path: /qdrant(/|$)(.*)
            pathType: ImplementationSpecific
            servicePort: 6333
    tls:
      - hosts:
        - sap-qdrant-test.apps.renci.org
        secretName: sap-qdrant-test.apps.renci.org-tls